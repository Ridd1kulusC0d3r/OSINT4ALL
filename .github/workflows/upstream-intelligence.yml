name: Upstream Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "37 8 * * 1"

permissions:
  contents: read

jobs:
  diff-upstreams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare tracked upstreams
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_upstreams.py
      - name: Upload upstream review report
        uses: actions/upload-artifact@v4
        with:
          name: osint4all-upstream-intelligence
          path: artifacts/upstream-diff.md
